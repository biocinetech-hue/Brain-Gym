<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brain Gym — Daily Cognitive Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS — VARIABLES & RESET
           ============================================ */
        :root {
            --bg: #121417;
            --bg-elevated: #1a1d22;
            --bg-card: #1e2128;
            --bg-card-hover: #252932;
            --border: #2a2e36;
            --border-bright: #3a3f4a;
            --text: #f0f2f5;
            --text-dim: #8b919c;
            --text-faint: #5a5f6a;
            --accent: #b4ff39;
            --accent-dim: rgba(180, 255, 57, 0.12);
            --accent-glow: rgba(180, 255, 57, 0.35);
            --danger: #ff4757;
            --danger-dim: rgba(255, 71, 87, 0.12);
            --warning: #ffa502;
            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 16px;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{
            background:var(--bg);
            color:var(--text);
            font-family:'Inter',-apple-system,sans-serif;
            font-size:15px;
            line-height:1.5;
            min-height:100vh;
            min-height:100dvh; /* Fixes mobile browser address bar height issue */
            -webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color: transparent; /* Removes blue flash on tap */
            touch-action: manipulation; /* Prevents double tap to zoom */
            user-select: none; /* Prevents text selection on rapid taps */
            -webkit-user-select: none;
        }
        button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;user-select:none}
        button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        input{font-family:inherit;user-select:text;-webkit-user-select:text}

        /* ============================================
           LAYOUT
           ============================================ */
        .app{max-width:1100px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 60px}
        .app-header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 28px;border-bottom:1px solid var(--border);margin-bottom:28px;gap:16px;flex-wrap:wrap}
        .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em}
        .logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:grid;place-items:center;color:#000}
        .header-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .stat-pill{display:flex;align-items:center;gap:8px;padding:7px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--text-dim)}
        .stat-pill .flame{font-size:14px}
        .stat-pill .num{font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--text)}

        /* ============================================
           ONBOARDING & WEEKLY PLAN
           ============================================ */
        .onboarding-screen{text-align:center;max-width:600px;margin:0 auto;padding:40px 20px}
        .onboarding-screen h1{font-family:'Space Grotesk';font-size:clamp(28px,5vw,40px);font-weight:700;margin-bottom:12px;letter-spacing:-0.02em}
        .onboarding-screen p{color:var(--text-dim);margin-bottom:32px;font-size:15px}
        .level-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:24px}
        @media(min-width:540px){.level-grid{grid-template-columns:repeat(3,1fr)}}
        .level-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 16px;cursor:pointer;transition:all .2s;text-align:center}
        .level-card:hover{border-color:var(--accent);background:var(--bg-card-hover);transform:translateY(-3px)}
        .level-card .icon{width:48px;height:48px;background:var(--bg-elevated);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;color:var(--accent)}
        .level-card h3{font-family:'Space Grotesk';font-size:18px;margin-bottom:6px}
        .level-card p{font-size:12px;color:var(--text-faint);margin:0}

        .weekly-plan-screen{padding:20px 0}
        .week-list{display:flex;flex-direction:column;gap:12px}
        .week-day{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;transition:all .2s;gap:12px;flex-wrap:wrap}
        .week-day:hover{border-color:var(--border-bright);background:var(--bg-card-hover)}
        .week-day.completed{opacity:0.6}
        .week-day.completed .day-name::before{content:'✓ ';color:var(--accent)}
        .day-info{flex:1;min-width:200px}
        .day-info .day-name{font-family:'Space Grotesk';font-weight:600;font-size:16px;margin-bottom:2px}
        .day-info .day-focus{font-size:12px;color:var(--text-dim)}
        .day-info .day-games{font-size:11px;color:var(--text-faint);margin-top:4px}

        /* ============================================
           DASHBOARD COMPONENTS
           ============================================ */
        .section-title{font-family:'Space Grotesk';font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);margin-bottom:14px;display:flex;align-items:center;gap:10px}
        .section-title::after{content:'';flex:1;height:1px;background:var(--border)}

        .today-strip{display:flex;gap:12px;padding:14px 18px;background:linear-gradient(135deg,var(--accent-dim),transparent 80%);border:1px solid var(--accent-dim);border-radius:var(--radius);margin-bottom:32px;align-items:center;flex-wrap:wrap}
        .today-strip .label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;font-weight:700;white-space:nowrap}
        .today-strip .games{display:flex;gap:6px;flex-wrap:wrap}
        .today-chip{padding:4px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500}

        .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;margin-bottom:40px}

        .equip-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;display:flex;flex-direction:column;gap:12px;transition:all .2s ease;position:relative;overflow:hidden}
        .equip-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:0;transition:opacity .2s}
        .equip-card:hover{background:var(--bg-card-hover);border-color:var(--border-bright);transform:translateY(-2px)}
        .equip-card:hover::before{opacity:1}
        .equip-card .icon{width:44px;height:44px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);display:grid;place-items:center;color:var(--accent)}
        .equip-card h3{font-family:'Space Grotesk';font-size:17px;font-weight:600;letter-spacing:-0.01em}
        .equip-card .skill{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:2px}
        .equip-card .desc{font-size:13px;color:var(--text-dim);flex:1;line-height:1.45}

        /* ============================================
           BUTTONS
           ============================================ */
        .btn-primary{background:var(--accent);color:#000;padding:12px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
        .btn-primary:hover{background:#c8ff5a;box-shadow:0 0 20px var(--accent-glow)}
        .btn-primary:disabled{background:var(--bg-elevated);color:var(--text-faint);cursor:not-allowed;box-shadow:none}
        .btn-secondary{background:transparent;color:var(--text);padding:12px 20px;border:1px solid var(--border-bright);border-radius:var(--radius-sm);font-weight:500;font-size:14px;transition:all .15s}
        .btn-secondary:hover{background:var(--bg-elevated);border-color:var(--text-dim)}
        .btn-ghost{background:transparent;color:var(--text-dim);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
        .btn-ghost:hover{color:var(--text);background:var(--bg-elevated)}

        /* ============================================
           SESSION SHELL & COUNTDOWN
           ============================================ */
        .session-shell{min-height:70vh;display:flex;flex-direction:column}
        .session-topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:24px;gap:12px;flex-wrap:wrap}
        .session-topbar .game-info{display:flex;flex-direction:column}
        .session-topbar .game-name{font-family:'Space Grotesk';font-weight:600;font-size:16px}
        .session-topbar .game-meta{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em}
        .session-topbar .timer{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
        .session-topbar .warmup-badge{font-family:'Space Grotesk';font-weight:700;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--warning);padding:4px 8px;border:1px solid var(--warning);border-radius:4px;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
        .session-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0;min-height:340px}
        .session-controls{padding:20px 0 0;border-top:1px solid var(--border);margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}

        .countdown-overlay{text-align:center}
        .countdown-num{font-family:'Space Grotesk';font-size:clamp(80px,25vw,120px);font-weight:700;color:var(--accent);line-height:1;animation:scaleIn .5s ease}
        .countdown-text{color:var(--text-dim);font-size:14px;margin-top:12px;text-transform:uppercase;letter-spacing:0.1em}
        @keyframes scaleIn{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}

        /* ============================================
           INTRO SCREEN
           ============================================ */
        .intro-screen{max-width:560px;margin:0 auto;padding:30px 20px;text-align:center}
        .intro-screen .btn-ghost{margin-bottom:24px}
        .intro-screen .icon-big{width:72px;height:72px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);display:grid;place-items:center;margin:0 auto 20px;color:var(--accent)}
        .intro-screen h2{font-family:'Space Grotesk';font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
        .intro-screen .skill-tag{display:inline-block;padding:4px 12px;background:var(--accent-dim);color:var(--accent);border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:24px}
        .intro-screen .instructions{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:left;margin-bottom:20px}
        .intro-screen .instructions h4{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);margin-bottom:10px;font-weight:600}
        .intro-screen .instructions ul{list-style:none;padding:0}
        .intro-screen .instructions li{padding:5px 0 5px 22px;position:relative;font-size:14px;color:var(--text)}
        .intro-screen .instructions li::before{content:'';position:absolute;left:0;top:12px;width:6px;height:6px;background:var(--accent);border-radius:50%}

        /* ============================================
           TUTORIAL / FORM CHECK COMPONENTS
           ============================================ */
        .coach-bubble{background:var(--bg-card);border:1px solid var(--accent);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;max-width:400px;text-align:center;position:relative;box-shadow:0 0 20px rgba(180,255,57,0.1)}
        .coach-bubble::before{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:var(--bg-card);border-right:1px solid var(--accent);border-bottom:1px solid var(--accent)}
        .coach-bubble .step-num{font-family:'Space Grotesk';font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
        .coach-bubble .text{font-size:14px;line-height:1.5}
        .tut-hint{display:inline-block;margin-top:12px;font-size:12px;color:var(--text-dim);font-style:italic}

        /* ============================================
           GAME-SPECIFIC COMPONENTS
           ============================================ */
        .matrix-grid{display:grid;gap:10px;width:min(360px,90vw);aspect-ratio:1}
        .matrix-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .1s,border-color .1s}
        .matrix-cell.active{background:var(--accent);box-shadow:0 0 20px var(--accent-glow);border-color:var(--accent)}
        .matrix-cell.selected{background:var(--accent-dim);border-color:var(--accent)}
        .matrix-cell.miss{background:var(--danger);border-color:var(--danger)}
        .matrix-cell.disabled{pointer-events:none}

        .react-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,90vw);aspect-ratio:1}
        .react-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:background .08s,border-color .08s}
        .react-cell.active{background:var(--accent);box-shadow:0 0 24px var(--accent-glow);border-color:var(--accent)}
        .react-cell.miss{background:var(--danger);border-color:var(--danger)}
        .react-cell.correct{background:var(--accent-dim);border-color:var(--accent);box-shadow:0 0 15px var(--accent-glow)}

        .stroop-mode{font-family:'Space Grotesk';font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;padding:8px 18px;background:var(--accent-dim);color:var(--accent);border-radius:999px;margin-bottom:24px}
        .stroop-word{font-family:'Space Grotesk';font-size:clamp(48px,10vw,80px);font-weight:700;letter-spacing:-0.02em;margin-bottom:32px;line-height:1}
        .stroop-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(440px,90vw)}
        .stroop-btn{padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-family:'Space Grotesk';font-weight:700;font-size:18px;transition:all .15s}
        .stroop-btn:hover{background:var(--bg-card-hover);border-color:var(--border-bright)}
        .stroop-btn.correct{border-color:var(--accent);background:var(--accent-dim)}
        .stroop-btn.wrong{border-color:var(--danger);background:var(--danger-dim)}
        .stroop-btn.disabled{opacity:0.4;pointer-events:none}

        .digit-display{width:min(280px,80vw);min-height:200px;background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-lg);display:grid;place-items:center;margin-bottom:20px;transition:border-color .2s;padding:10px}
        .digit-current{font-family:'Space Grotesk';font-size:clamp(80px,18vw,120px);font-weight:700;color:var(--accent);line-height:1}
        .digit-input-display{font-family:'Space Grotesk';font-size:clamp(28px,6vw,36px);font-weight:600;letter-spacing:0.15em;min-height:50px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px;color:var(--text)}
        .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(300px,80vw)}
        .numpad button{padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-family:'Space Grotesk';font-size:20px;font-weight:600;transition:all .1s}
        .numpad button:hover{background:var(--bg-card-hover);border-color:var(--border-bright)}
        .numpad button:active{background:var(--accent-dim);border-color:var(--accent)}
        .numpad .action-btn{background:var(--bg-elevated);color:var(--text-dim);font-size:14px}
        .numpad .action-btn:hover{color:var(--text)}
        .numpad button.disabled{opacity:0.4;pointer-events:none}

        .countdown-ring{width:56px;height:56px;position:relative;margin-bottom:14px}
        .countdown-ring svg{transform:rotate(-90deg)}
        .countdown-ring circle{fill:none;stroke-width:4}
        .countdown-ring .bg-ring{stroke:var(--border)}
        .countdown-ring .fg-ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
        .countdown-num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:20px}
        .pattern-seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
        .pattern-shape{width:clamp(50px,12vw,64px);height:clamp(50px,12vw,64px);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);display:grid;place-items:center}
        .pattern-shape.question{border:2px dashed var(--accent);color:var(--text-dim);font-family:'Space Grotesk';font-weight:700;font-size:28px}
        .pattern-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(440px,90vw)}
        @media(max-width:420px){.pattern-options{grid-template-columns:repeat(2,1fr)}}
        .pattern-option{padding:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);display:grid;place-items:center;transition:all .15s}
        .pattern-option:hover{background:var(--bg-card-hover);border-color:var(--border-bright)}
        .pattern-option.correct{border-color:var(--accent);background:var(--accent-dim)}
        .pattern-option.wrong{border-color:var(--danger);background:var(--danger-dim)}
        .pattern-option.disabled{opacity:0.4;pointer-events:none}

        .divergent-timer{font-family:'Space Grotesk';font-weight:700;font-size:32px;color:var(--accent);margin-bottom:8px;font-variant-numeric:tabular-nums}
        .divergent-prompt{font-family:'Space Grotesk';font-size:clamp(28px,5vw,40px);font-weight:700;text-align:center;margin-bottom:4px;text-transform:lowercase}
        .divergent-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;text-align:center;max-width:400px}
        .divergent-input{width:min(440px,90vw);padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:16px;margin-bottom:12px}
        .divergent-input:focus{outline:none;border-color:var(--accent)}
        .divergent-list{width:min(440px,90vw);max-height:180px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:6px}
        .divergent-list-item{padding:7px 10px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;font-size:14px}
        .divergent-list-item .idx{color:var(--accent);font-family:'Space Grotesk';font-weight:600;font-size:12px;min-width:22px}

        .results-screen{max-width:560px;margin:0 auto;padding:30px 20px;text-align:center}
        .results-screen .check{width:64px;height:64px;background:var(--accent-dim);border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;color:var(--accent)}
        .results-screen h2{font-family:'Space Grotesk';font-size:28px;font-weight:700;margin-bottom:4px;letter-spacing:-0.02em}
        .results-screen .subtitle{color:var(--text-dim);margin-bottom:28px;font-size:14px}
        .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:24px}
        .metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
        .metric-card .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:6px}
        .metric-card .value{font-family:'Space Grotesk';font-weight:700;font-size:26px;color:var(--text);line-height:1.1}
        .metric-card .value .unit{font-size:13px;color:var(--text-dim);margin-left:3px;font-weight:500}
        .interpretation{background:var(--bg-card);border-left:3px solid var(--accent);padding:14px 18px;border-radius:var(--radius-sm);text-align:left;font-size:14px;color:var(--text);margin-bottom:24px;line-height:1.55}
        .results-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

        .app-footer{margin-top:60px;padding:24px 0 0;border-top:1px solid var(--border);font-size:12px;color:var(--text-faint);text-align:center;line-height:1.6}
        .demo-note{display:inline-block;padding:4px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--text-dim);margin-bottom:12px}

        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card);border:1px solid var(--border-bright);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;z-index:100;max-width:90vw;text-align:center}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        .hidden{display:none!important}
    </style>
</head>
<body>
<div class="app">
    <header class="app-header">
        <div class="logo">
            <div class="logo-mark">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 13H11l-2 9 8.5-11H11l2-9z"/></svg>
            </div>
            Brain Gym
        </div>
        <div class="header-stats">
            <div class="stat-pill"><span class="flame">🔥</span><span class="num" id="streak-num">7</span><span>day streak</span></div>
            <div class="stat-pill"><span class="num" id="weekly-min">42</span><span>min this week</span></div>
        </div>
    </header>
    <main id="main"></main>
    <footer class="app-footer">
        <div class="demo-note">Demo build — progress resets on refresh</div>
        <p>Brain Gym trains specific cognitive skills through practice. It is not a medical treatment and does not guarantee general intelligence gains.</p>
    </footer>
</div>
<div class="toast" id="toast"></div>

<script>
    /* ============================================
       BRAIN GYM — Single-File Cognitive Trainer
       ============================================ */

    /* ---------- SHAPE RENDERER ---------- */
    function shapeSvg(shape, color, size=48){
        const c = COLOR_HEX[color] || color;
        const h = size/2, r = h - 3;
        switch(shape){
            case 'circle':   return `<svg width="${size}" height="${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="${c}"/></svg>`;
            case 'square':   return `<svg width="${size}" height="${size}"><rect x="3" y="3" width="${size-6}" height="${size-6}" fill="${c}" rx="2"/></svg>`;
            case 'triangle': return `<svg width="${size}" height="${size}"><polygon points="${h},3 ${size-3},${size-3} 3,${size-3}" fill="${c}"/></svg>`;
            case 'star':     return `<svg width="${size}" height="${size}"><polygon points="${starPoints(h,h,r,r*0.4,5)}" fill="${c}"/></svg>`;
            case 'hexagon':  return `<svg width="${size}" height="${size}"><polygon points="${hexPoints(h,h,r)}" fill="${c}"/></svg>`;
        }
        return '';
    }
    function starPoints(cx,cy,rO,rI,n){
        let p='';
        for(let i=0;i<n*2;i++){
            const r=i%2===0?rO:rI, a=(Math.PI/n)*i-Math.PI/2;
            p+=`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} `;
        }
        return p.trim();
    }
    function hexPoints(cx,cy,r){
        let p='';
        for(let i=0;i<6;i++){
            const a=(Math.PI/3)*i-Math.PI/6;
            p+=`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} `;
        }
        return p.trim();
    }

            case 'dashboard':  renderDashboard(); break;

            case 'tutorial':   startTutorial(payload); break;
            case 'session':    startSession(payload); break;
            case 'results':    renderResults(payload); break;
        }
        window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ============================================

    function startSession(gameId){
        state.currentGame = gameId;
        state.sessionStartMs = Date.now();
        const g = GAMES[gameId];
        const main = document.getElementById('main');
        main.innerHTML = `
    <div class="session-shell">
      <div class="session-topbar">
        <div class="game-info">
          <div class="game-name">${g.name}</div>
          <div class="game-meta">${g.skill}</div>
        </div>
        <div style="display:flex;align-items:center;gap:14px">

          <button class="btn-ghost" onclick="go('dashboard')">${svgClose()} Exit</button>
        </div>
      </div>
      <div class="session-content" id="session-content"></div>
      <div class="session-controls" id="session-controls"></div>
    </div>
  `;

        sContent().innerHTML = `<div class="countdown-overlay"><div class="countdown-num" id="cd-num">3</div><div class="countdown-text">Get Ready</div></div>`;

        let count = 3;
        const cdInterval = setInterval(() => {
            count--;
            if (count > 0) {
                const el = document.getElementById('cd-num');
                if(el) {
                    el.textContent = count;
                    el.style.animation = 'none';
                    el.offsetHeight;
                    el.style.animation = 'scaleIn .5s ease';
                }
            } else {
                clearInterval(cdInterval);
                const idx = state.timers.indexOf(cdInterval);
                if(idx > -1) state.timers.splice(idx, 1);

                trackInterval(()=>{
                    const el = document.getElementById('session-timer');
                    if(el) el.textContent = formatTime(Date.now() - state.sessionStartMs);
                }, 250);

                ({matrix:startMatrix, reaction:startReaction, stroop:startStroop, digit:startDigit, pattern:startPattern, divergent:startDivergent})[gameId]();
            }
        }, 1000);
        state.timers.push(cdInterval);
    }

    const sContent = () => document.getElementById('session-content');
    const sControls = () => document.getElementById('session-controls');

    /* ============================================
       11. GAME 1 — MATRIX MEMORY (Working Memory)
       ============================================ */
    function startMatrix(){
        const TOTAL_ROUNDS = 8;
        let round = 0;
        let grid = state.difficulty.matrix.grid;
        let tiles = state.difficulty.matrix.tiles;
        let maxTiles = state.difficulty.matrix.maxTiles;
        let consecFails = 0;
        let target = [];
        let clicked = [];
        let phase = 'idle';

        function startRound(){
            if(round >= TOTAL_ROUNDS){ finish(); return; }
            target = [];
            clicked = [];
            phase = 'display';

            const totalCells = grid * grid;
            while(target.length < tiles){
                const r = randInt(0, totalCells - 1);
                if(!target.includes(r)) target.push(r);
            }

            sContent().innerHTML = `
      <div class="matrix-grid" id="m-grid" style="grid-template-columns:repeat(${grid},1fr)">
        ${Array.from({length:totalCells},(_,i)=>`<div class="matrix-cell disabled" data-idx="${i}"></div>`).join('')}
      </div>
      <div class="session-info">Round <span>${round+1}</span> / ${TOTAL_ROUNDS} · Tiles: <span class="n-level">${tiles}</span></div>
    `;
            sControls().innerHTML = `<div style="color:var(--text-dim);font-size:13px">Memorize the pattern...</div>`;

            let idx = 0;
            const showOne = ()=>{
                if(idx >= target.length){
                    trackTimeout(hidePattern, 600);
                    return;
                }
                const cell = document.querySelector(`#m-grid .matrix-cell[data-idx="${target[idx]}"]`);
                cell.classList.add('active');
                trackTimeout(()=>{
                    cell.classList.remove('active');
                    trackTimeout(()=>{ idx++; showOne(); }, 200);
                }, 600);
            };
            trackTimeout(showOne, 800);
        }

        function hidePattern(){
            phase = 'input';
            sControls().innerHTML = `<div style="color:var(--text-dim);font-size:13px">Tap the tiles that were lit.</div>`;
            document.querySelectorAll('#m-grid .matrix-cell').forEach(c=>{
                c.classList.remove('disabled');
                c.onclick = ()=>handleClick(parseInt(c.dataset.idx), c);
            });
        }

        function handleClick(idx, cell){
            if(phase !== 'input') return;
            if(clicked.includes(idx)) return;

            if(target.includes(idx)){
                cell.classList.add('selected');
                clicked.push(idx);
                if(clicked.length === target.length){
                    phase = 'feedback';
                    consecFails = 0;
                    maxTiles = Math.max(maxTiles, tiles);
                    if(tiles < 8) tiles++;
                    if(tiles === 5 && grid < 4) grid = 4;
                    if(tiles === 8 && grid < 5) grid = 5;

                    state.difficulty.matrix.grid = grid;
                    state.difficulty.matrix.tiles = tiles;
                    state.difficulty.matrix.maxTiles = maxTiles;

                    sControls().innerHTML = `<div style="color:var(--accent);font-size:14px;font-weight:600">Perfect! Next pattern...</div>`;
                    round++;
                    trackTimeout(startRound, 1200);
                }
            } else {
                cell.classList.add('miss');
                phase = 'feedback';
                consecFails++;
                if(consecFails >= 1){
                    if(tiles > 3) tiles--;
                    if(tiles === 4 && grid > 3) grid = 3;
                    state.difficulty.matrix.grid = grid;
                    state.difficulty.matrix.tiles = tiles;
                    consecFails = 0;
                }

                target.forEach(tIdx => {
                    const c = document.querySelector(`#m-grid .matrix-cell[data-idx="${tIdx}"]`);
                    if(!c.classList.contains('selected')) c.classList.add('miss');
                });

                sControls().innerHTML = `<div style="color:var(--danger);font-size:14px;font-weight:600">Missed! Next pattern...</div>`;
                round++;
                trackTimeout(startRound, 1500);
            }
        }

        function finish(){
            const perf = clamp((maxTiles / 8) * 100, 0, 100);
            const interp = `You recalled up to ${maxTiles} tiles at once. ${maxTiles >= 6 ? 'Elite spatial memory capacity!' : maxTiles >= 4 ? 'Solid working memory span.' : 'Keep training to extend your capacity.'}`;
            go('results', {gameId:'matrix', metrics:[
                    {label:'Max Tiles', value:maxTiles, unit:''},
                    {label:'Grid Size', value:`${grid}x${grid}`, unit:''},
                    {label:'Rounds', value:TOTAL_ROUNDS, unit:''}
                ], performance:perf, interpretation:interp});
        }

        startRound();
    }

    /* ============================================
       12. GAME 2 — REACTION GRID (Processing Speed)
       ============================================ */
    function startReaction(){
        const TOTAL = 20;
        let flashCount = 0, misses = 0, fastest = Infinity;
        let times = [];
        let activeCell = -1, flashStart = 0, waitingForFlash = false;
        let windowMs = state.difficulty.reaction.windowMs;
        let flashGen = 0;

        sContent().innerHTML = `
    <div class="react-grid" id="rg-grid">
      ${Array.from({length:9},(_,i)=>`<button class="react-cell" data-idx="${i}" aria-label="Cell ${i+1}"></button>`).join('')}
    </div>
    <div class="session-info">Flash <span id="rg-count">0</span> / ${TOTAL} · Avg: <span id="rg-avg">—</span> · Best: <span id="rg-best">—</span> · Misses: <span id="rg-miss">0</span></div>
  `;
        sControls().innerHTML = `<div style="color:var(--text-dim);font-size:13px">Wait for the flash, then tap it as fast as you can.</div>`;
        document.querySelectorAll('.react-cell').forEach(c=>{
            c.onclick = ()=>handleTap(parseInt(c.dataset.idx));
        });

        function scheduleFlash(){
            if(flashCount >= TOTAL){ finish(); return; }
            waitingForFlash = true;
            const delay = flashCount < 3 ? 2000 : randInt(1000, 2000);
            trackTimeout(doFlash, delay);
        }

        function doFlash(){
            waitingForFlash = false;
            flashGen++;
            const myGen = flashGen;
            activeCell = randInt(0, 8);
            flashStart = Date.now();
            document.querySelector(`.react-cell[data-idx="${activeCell}"]`).classList.add('active');
            trackTimeout(()=>{
                if(myGen !== flashGen) return;
                if(activeCell !== -1){
                    const cell = document.querySelector(`.react-cell[data-idx="${activeCell}"]`);
                    cell.classList.remove('active');
                    cell.classList.add('miss');
                    trackTimeout(()=>cell.classList.remove('miss'), 400);
                    misses++; activeCell = -1;
                    flashCount++; updateStats();
                    scheduleFlash();
                }
            }, windowMs);
        }

        function handleTap(idx){
            if(waitingForFlash){
                const cell = document.querySelector(`.react-cell[data-idx="${idx}"]`);
                cell.classList.add('miss');
                trackTimeout(()=>cell.classList.remove('miss'), 300);
                return;
            }
            if(activeCell === -1) return;
            const rt = Date.now() - flashStart;
            if(idx === activeCell){
                flashGen++;
                times.push(rt);
                fastest = Math.min(fastest, rt);
                const cell = document.querySelector(`.react-cell[data-idx="${idx}"]`);
                cell.classList.remove('active');
                cell.classList.add('correct');
                trackTimeout(()=>cell.classList.remove('correct'), 400);
                activeCell = -1;
                flashCount++;
                updateStats();
                if(times.length >= 5){
                    const avg = times.reduce((a,b)=>a+b,0) / times.length;
                    if(avg < 400 && windowMs > 700) windowMs = Math.max(700, windowMs - 100);
                    else if(avg < 500 && windowMs > 900) windowMs = Math.max(900, windowMs - 50);
                }
                state.difficulty.reaction.windowMs = windowMs;
                scheduleFlash();
            } else {
                const cell = document.querySelector(`.react-cell[data-idx="${idx}"]`);
                cell.classList.add('miss');
                trackTimeout(()=>cell.classList.remove('miss'), 300);
                misses++;
            }
        }

        function updateStats(){
            document.getElementById('rg-count').textContent = flashCount;
            if(times.length > 0){
                const avg = Math.round(times.reduce((a,b)=>a+b,0) / times.length);
                document.getElementById('rg-avg').textContent = avg + 'ms';
                document.getElementById('rg-best').textContent = fastest + 'ms';
            }
            document.getElementById('rg-miss').textContent = misses;
        }

        function finish(){
            const avg = times.length > 0 ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : 0;
            const perf = clamp(100 - (avg - 300) / 7, 0, 100);
            let band = 'slow';
            if(avg < 350) band = 'elite';
            else if(avg < 450) band = 'fast';
            else if(avg < 600) band = 'average';
            const interp = `Your average reaction time of ${avg}ms is in the "${band}" range for this difficulty. ${misses > 3 ? 'Work on reducing misses.' : 'Good consistency.'}`;
            go('results', {gameId:'reaction', metrics:[
                    {label:'Avg Reaction', value:avg, unit:'ms'},
                    {label:'Fastest', value:fastest===Infinity?0:fastest, unit:'ms'},
                    {label:'Misses', value:misses, unit:''}
                ], performance:perf, interpretation:interp});
        }

        scheduleFlash();
    }

    /* ============================================
       13. GAME 3 — STROOP SWITCH (Flexibility)
       ============================================ */
    function startStroop(){
        const WORDS = [
            {name:'RED', color:'#ff4757'},
            {name:'BLUE', color:'#3498db'},
            {name:'GREEN', color:'#2ecc71'},
            {name:'YELLOW', color:'#f1c40f'}
        ];
        const TOTAL = 24;
        let trial = 0, correct = 0;
        let congCorrect=0, congTotal=0, congTimes=[];
        let incongCorrect=0, incongTotal=0, incongTimes=[];
        let trialStart = 0, answered = false, current = null;

        sContent().innerHTML = `
    <div class="stroop-mode" id="st-mode">TAP THE WORD</div>
    <div class="stroop-word" id="st-word">READY</div>
  `;
        sControls().innerHTML = '';

        function nextTrial(){
            if(trial >= TOTAL){ finish(); return; }
            answered = false;
            let mode;

            if(state.level === 'Beginner'){
                if(trial < 5) mode = 'WORD';
                else if(trial < 10) mode = 'COLOR';
                else mode = Math.random() < 0.5 ? 'WORD' : 'COLOR';
            } else if(state.level === 'Intermediate'){
                if(trial < 3) mode = 'WORD';
                else if(trial < 6) mode = 'COLOR';
                else mode = Math.random() < 0.5 ? 'WORD' : 'COLOR';
            } else {
                mode = Math.random() < 0.5 ? 'WORD' : 'COLOR';
            }

            const wordObj = randItem(WORDS);
            const colorObj = Math.random() < 0.5 ? wordObj : randItem(WORDS.filter(w=>w!==wordObj));
            const congruent = wordObj === colorObj;
            current = {word:wordObj, color:colorObj, congruent, mode};
            trialStart = Date.now();

            document.getElementById('st-mode').textContent = mode === 'WORD' ? 'TAP THE WORD' : 'TAP THE COLOR';
            const wordEl = document.getElementById('st-word');
            wordEl.textContent = wordObj.name;
            wordEl.style.color = colorObj.color;

            sControls().innerHTML = `
      <div class="stroop-options">
        ${WORDS.map(w=>`<button class="stroop-btn" data-name="${w.name}" style="color:${w.color}">${w.name}</button>`).join('')}
      </div>
      <div style="color:var(--text-dim);font-size:13px;width:100%;text-align:center;margin-top:6px">Trial ${trial+1} / ${TOTAL}</div>
    `;
            document.querySelectorAll('.stroop-btn').forEach(b=>{
                b.onclick = ()=>answer(b.dataset.name);
            });
        }

        function answer(name){
            if(answered) return;
            answered = true;
            const rt = Date.now() - trialStart;
            const correctAns = current.mode === 'WORD' ? current.word.name : current.color.name;
            const ok = name === correctAns;
            if(current.congruent){ congTotal++; if(ok){congCorrect++; congTimes.push(rt)} }
            else { incongTotal++; if(ok){incongCorrect++; incongTimes.push(rt)} }
            if(ok) correct++;

            document.querySelectorAll('.stroop-btn').forEach(b=>{
                if(b.dataset.name === correctAns) b.classList.add('correct');
                else if(b.dataset.name === name) b.classList.add('wrong');
            });

            trial++;
            trackTimeout(nextTrial, 650);
        }

        function finish(){
            const accuracy = Math.round((correct / TOTAL) * 100);
            const cAvg = congTimes.length ? Math.round(congTimes.reduce((a,b)=>a+b,0)/congTimes.length) : 0;
            const iAvg = incongTimes.length ? Math.round(incongTimes.reduce((a,b)=>a+b,0)/incongTimes.length) : 0;
            const stroopEffect = iAvg - cAvg;
            const overallAvg = (cAvg + iAvg) / 2 || 1000;
            const perf = clamp((accuracy/100)*50 + (1 - (overallAvg - 400)/1200)*50, 0, 100);
            const interp = `Accuracy ${accuracy}%. Congruent avg ${cAvg}ms vs incongruent ${iAvg}ms — Stroop interference ≈ ${stroopEffect}ms. ${stroopEffect < 150 ? 'Low switch cost — strong flexibility.' : 'Practice rule-switching to reduce interference.'}`;
            go('results', {gameId:'stroop', metrics:[
                    {label:'Accuracy', value:accuracy, unit:'%'},
                    {label:'Congruent Avg', value:cAvg, unit:'ms'},
                    {label:'Incongruent Avg', value:iAvg, unit:'ms'},
                    {label:'Stroop Effect', value:stroopEffect, unit:'ms'}
                ], performance:perf, interpretation:interp});
        }

        trackTimeout(nextTrial, 500);
    }

    /* ============================================
       14. GAME 4 — DIGIT SPAN (Memory Recall)
       ============================================ */
    function startDigit(){
        const TOTAL_ROUNDS = 8;
        let round = 0;
        let span = state.difficulty.digit.span;
        let maxFwd = state.difficulty.digit.maxForward;
        let maxBwd = state.difficulty.digit.maxBackward;
        let consecFails = state.difficulty.digit.consecFails;
        let currentSeq = [], userInput = [], mode = 'forward', phase = 'idle';

        function startRound(){
            if(round >= TOTAL_ROUNDS){ finish(); return; }
            mode = round % 2 === 0 ? 'forward' : 'reverse';
            currentSeq = Array.from({length:span}, ()=>randInt(0,9));
            userInput = [];
            phase = 'display';

            sContent().innerHTML = `
      <div class="digit-display" id="d-display"><div class="digit-current" id="d-current">—</div></div>
      <div class="session-info">Round <span>${round+1}</span> / ${TOTAL_ROUNDS} · Span <span class="n-level">${span}</span> · Mode: <strong style="color:var(--accent)">${mode==='forward'?'FORWARD':'REVERSE'}</strong></div>
    `;
            sControls().innerHTML = `<div style="color:var(--text-dim);font-size:13px">Memorize the sequence...</div>`;

            let idx = 0;
            const showOne = ()=>{
                if(idx >= currentSeq.length){
                    document.getElementById('d-current').textContent = '';
                    trackTimeout(startInput, 400);

                }

                trackTimeout(()=>{
                    document.getElementById('d-current').textContent = '';
                    trackTimeout(()=>{ idx++; showOne(); }, 200);
                }, 800);
            };
            trackTimeout(showOne, 600);
        }

        function startInput(){
            phase = 'input';
            sContent().innerHTML = `
      <div class="digit-input-display" id="d-input"></div>
      <div class="session-info">Round <span>${round+1}</span> / ${TOTAL_ROUNDS} · Span <span class="n-level">${span}</span> · Mode: <strong style="color:var(--accent)">${mode==='forward'?'FORWARD':'REVERSE'}</strong></div>
    `;
            sControls().innerHTML = `
      <div class="numpad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-d="${n}">${n}</button>`).join('')}
        <button class="action-btn" data-d="del">⌫</button>
        <button data-d="0">0</button>
        <button class="action-btn disabled" data-d="submit">OK</button>
      </div>
    `;
            document.querySelectorAll('.numpad button').forEach(b=>{
                b.onclick = ()=>handleKey(b.dataset.d, b);
            });
            updateInputDisplay();
        }

        function handleKey(d, btn){
            if(phase !== 'input') return;
            if(d === 'del') {
                if(userInput.length > 0) userInput.pop();
            } else if(d === 'submit'){
                if(!btn.classList.contains('disabled')) checkAnswer();
                return;
            } else if(userInput.length < span) {
                userInput.push(parseInt(d));
            }
            updateInputDisplay();
        }

        function updateInputDisplay(){
            const el = document.getElementById('d-input');
            if(!el) return;
            const filled = userInput.join(' ');
            const remaining = Array(span - userInput.length).fill('_').join(' ');
            el.innerHTML = `<span style="color:var(--text)">${filled}</span>${filled&&remaining?' ':''}<span style="color:var(--text-faint)">${remaining}</span>`;

            const okBtn = document.querySelector('.numpad button[data-d="submit"]');
            if(okBtn){
                if(userInput.length === span) okBtn.classList.remove('disabled');
                else okBtn.classList.add('disabled');
            }
        }

        function checkAnswer(){
            if(phase !== 'input') return;
            phase = 'feedback';
            const target = mode === 'forward' ? currentSeq : [...currentSeq].reverse();
            const ok = userInput.length === target.length && userInput.every((d,i)=>d===target[i]);

            if(ok){
                consecFails = 0;
                if(mode === 'forward') maxFwd = Math.max(maxFwd, span);
                else maxBwd = Math.max(maxBwd, span);
                if(span < 10) span++;
            } else {
                consecFails++;
                if(consecFails >= 2 && span > 3){ span--; consecFails = 0; }
            }
            state.difficulty.digit.span = span;
            state.difficulty.digit.maxForward = maxFwd;
            state.difficulty.digit.maxBackward = maxBwd;
            state.difficulty.digit.consecFails = consecFails;

            const color = ok ? 'var(--accent)' : 'var(--danger)';
            sContent().innerHTML = `
      <div class="digit-display" style="border-color:${color}">
        <div style="text-align:center">
          <div style="font-family:'Space Grotesk';font-size:22px;font-weight:700;color:${color};margin-bottom:8px">${ok?'CORRECT':'INCORRECT'}</div>
          <div style="color:var(--text-dim);font-size:13px">Correct sequence:</div>
          <div style="font-family:'Space Grotesk';font-size:28px;font-weight:600;color:var(--text);letter-spacing:0.15em;margin-top:6px">${target.join(' ')}</div>
        </div>
      </div>
    `;
            sControls().innerHTML = '';
            round++;
            trackTimeout(startRound, 1800);
        }

        function finish(){
            const perf = clamp(((maxFwd + maxBwd) / 20) * 100, 0, 100);
            const interp = `Max forward span ${maxFwd}, max backward span ${maxBwd}. ${maxFwd >= 7 ? 'Excellent recall capacity.' : maxFwd >= 5 ? 'Solid working memory span.' : 'Keep training to extend span.'}`;
            go('results', {gameId:'digit', metrics:[
                    {label:'Max Forward', value:maxFwd, unit:''},
                    {label:'Max Backward', value:maxBwd, unit:''},
                    {label:'Rounds', value:TOTAL_ROUNDS, unit:''}
                ], performance:perf, interpretation:interp});
        }

        startRound();
    }

    /* ============================================
       15. GAME 5 — PATTERN SPRINT (Focus)
       ============================================ */
    const PATTERN_TEMPLATES = [
        {gen:()=>{const s=randItem(SHAPES),sc=randInt(0,3);return Array.from({length:5},(_,i)=>({shape:s,color:COLORS[(sc+i)%4]}))}},
        {gen:()=>{const c=randItem(COLORS),ss=randInt(0,4);return Array.from({length:5},(_,i)=>({shape:SHAPES[(ss+i)%5],color:c}))}},
        {gen:()=>{const s=randItem(SHAPES),[c1,c2]=pickN(COLORS,2);return Array.from({length:5},(_,i)=>({shape:s,color:i%2===0?c1:c2}))}},
        {gen:()=>{const c=randItem(COLORS),[s1,s2]=pickN(SHAPES,2);return Array.from({length:5},(_,i)=>({shape:i%2===0?s1:s2,color:c}))}},
        {gen:()=>{const c=randItem(COLORS),order=['circle','triangle','square','hexagon','star'],st=randInt(0,1);return Array.from({length:5},(_,i)=>({shape:order[(st+i)%5],color:c}))}},
        {gen:()=>{const s=pickN(SHAPES,3),c=pickN(COLORS,3);return Array.from({length:5},(_,i)=>({shape:s[i%3],color:c[i%3]}))}},
        {gen:()=>{const c=randItem(COLORS),[a,b,d]=pickN(SHAPES,3);return [{shape:a,color:c},{shape:b,color:c},{shape:d,color:c},{shape:b,color:c},{shape:a,color:c}]}},
        {gen:()=>{const s=randItem(SHAPES),[a,b,d]=pickN(COLORS,3);return [{shape:s,color:a},{shape:s,color:b},{shape:s,color:d},{shape:s,color:b},{shape:s,color:a}]}},
        {gen:()=>{const s=randItem(SHAPES),sc=randInt(0,3);return Array.from({length:5},(_,i)=>({shape:s,color:COLORS[(sc-i+8)%4]}))}},
        {gen:()=>{const c=randItem(COLORS),ss=randInt(0,4);return Array.from({length:5},(_,i)=>({shape:SHAPES[(ss-i+10)%5],color:c}))}},
        {gen:()=>{const ss=randInt(0,4),sc=randInt(0,3);return Array.from({length:5},(_,i)=>({shape:SHAPES[(ss+i)%5],color:COLORS[(sc+i)%4]}))}},
        {gen:()=>{const ss=randInt(0,4),sc=randInt(0,3);return Array.from({length:5},(_,i)=>({shape:SHAPES[(ss+i)%5],color:COLORS[(sc-i+8)%4]}))}},
        {gen:()=>{const s=randItem(SHAPES),[c1,c2]=pickN(COLORS,2);return [{shape:s,color:c1},{shape:s,color:c2},{shape:s,color:c1},{shape:s,color:c2},{shape:s,color:c1}]}},
        {gen:()=>{const c=randItem(COLORS),[s1,s2]=pickN(SHAPES,2);return [{shape:s1,color:c},{shape:s2,color:c},{shape:s1,color:c},{shape:s2,color:c},{shape:s1,color:c}]}},
        {gen:()=>{const [s1,s2]=pickN(SHAPES,2),[c1,c2]=pickN(COLORS,2);return Array.from({length:5},(_,i)=>i%2===0?{shape:s1,color:c1}:{shape:s2,color:c2})}}
    ];

    function startPattern(){
        const TOTAL = 12;
        let q = 0, correct = 0, times = [];
        let tier = state.difficulty.pattern.tier;
        let consecCorrect = state.difficulty.pattern.consecCorrect;
        let currentAnswer = null, qStart = 0, countdownStart = 0;
        let answered = false, rafId = null;

        const baseTime = state.level === 'Beginner' ? 15000 : (state.level === 'Intermediate' ? 10000 : 8000);

        sContent().innerHTML = `<div style="color:var(--text-dim);font-size:14px">Loading pattern...</div>`;
        sControls().innerHTML = '';

        function nextQuestion(){
            if(q >= TOTAL){ finish(); return; }
            answered = false;
            let pool;
            if(tier === 'Easy') pool = PATTERN_TEMPLATES.slice(0, 6);
            else if(tier === 'Medium') pool = PATTERN_TEMPLATES.slice(0, 11);
            else pool = PATTERN_TEMPLATES;
            const seq = randItem(pool).gen();
            const answer = seq[4];
            currentAnswer = answer;

            const distractors = [];
            while(distractors.length < 3){
                const ds = randItem(SHAPES), dc = randItem(COLORS);
                if((ds !== answer.shape || dc !== answer.color) && !distractors.find(d=>d.shape===ds && d.color===dc))
                    distractors.push({shape:ds, color:dc});
            }
            const options = shuffle([answer, ...distractors]);
            qStart = Date.now();
            countdownStart = Date.now();

            const TIME_LIMIT = tier === 'Hard' ? baseTime - 2000 : baseTime;

            sContent().innerHTML = `
      <div class="countdown-ring">
        <svg width="56" height="56">
          <circle class="bg-ring" cx="28" cy="28" r="24"/>
          <circle class="fg-ring" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="0" id="cd-ring"/>
        </svg>
        <div class="countdown-num" id="cd-num">${Math.ceil(TIME_LIMIT/1000)}</div>
      </div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Pick the shape that comes next</div>
      <div class="pattern-seq">
        ${seq.slice(0,4).map(s=>`<div class="pattern-shape">${shapeSvg(s.shape, s.color, 56)}</div>`).join('')}
        <div class="pattern-shape question">?</div>
      </div>
    `;
            sControls().innerHTML = `
      <div class="pattern-options">
        ${options.map((o,i)=>`<button class="pattern-option" data-i="${i}">${shapeSvg(o.shape, o.color, 44)}</button>`).join('')}
      </div>
      <div style="color:var(--text-dim);font-size:13px;width:100%;text-align:center;margin-top:6px">Q ${q+1} / ${TOTAL} · Tier: <strong style="color:var(--accent)">${tier}</strong></div>
    `;
            document.querySelectorAll('.pattern-option').forEach(b=>{
                b.onclick = ()=>answer_q(parseInt(b.dataset.i), options);
            });

            const tick = ()=>{
                if(answered) return;
                if(!document.getElementById('cd-ring')) return;
                const elapsed = Date.now() - countdownStart;
                const remaining = Math.max(0, TIME_LIMIT - elapsed);
                const sec = Math.ceil(remaining / 1000);
                const ringEl = document.getElementById('cd-ring');
                const numEl = document.getElementById('cd-num');
                if(ringEl) ringEl.style.strokeDashoffset = 150.8 * (1 - remaining / TIME_LIMIT);
                if(numEl) numEl.textContent = sec;
                if(remaining <= 0){ answer_q(-1, options); return; }
                rafId = requestAnimationFrame(tick);
            };
            rafId = requestAnimationFrame(tick);
        }

        function answer_q(idx, options){
            if(answered) return;
            answered = true;
            if(rafId) cancelAnimationFrame(rafId);
            const rt = Date.now() - qStart;
            times.push(rt);
            const chosen = idx >= 0 ? options[idx] : null;
            const ok = chosen && chosen.shape === currentAnswer.shape && chosen.color === currentAnswer.color;
            if(ok){
                correct++;
                consecCorrect++;
                if(consecCorrect >= 4 && tier !== 'Hard'){
                    tier = tier === 'Easy' ? 'Medium' : 'Hard';
                    consecCorrect = 0;
                }
            } else {
                consecCorrect = 0;
            }
            state.difficulty.pattern.tier = tier;
            state.difficulty.pattern.consecCorrect = consecCorrect;

            document.querySelectorAll('.pattern-option').forEach((b,i)=>{
                if(options[i].shape === currentAnswer.shape && options[i].color === currentAnswer.color) b.classList.add('correct');
                else if(i === idx) b.classList.add('wrong');
            });

            q++;
            trackTimeout(nextQuestion, 900);
        }

        function finish(){
            const accuracy = Math.round((correct / TOTAL) * 100);
            const avgTime = times.length ? Math.round(times.reduce((a,b)=>a+b,0)/times.length) : 0;
            const perf = clamp((accuracy/100)*70 + (1 - (avgTime - 2000)/6000)*30, 0, 100);
            const interp = `${correct}/${TOTAL} correct at ${tier} tier, avg ${avgTime}ms per question. ${accuracy >= 75 ? 'Strong pattern recognition.' : 'Slow down and verify the rule before answering.'}`;
            go('results', {gameId:'pattern', metrics:[
                    {label:'Accuracy', value:accuracy, unit:'%'},
                    {label:'Avg Time', value:avgTime, unit:'ms'},
                    {label:'Tier', value:tier, unit:''}
                ], performance:perf, interpretation:interp});
        }

        trackTimeout(nextQuestion, 400);
    }

    /* ============================================
       16. GAME 6 — DIVERGENT SPRINT (Creativity)
       ============================================ */
    function startDivergent(){
        const OBJECTS = ['brick','paperclip','spoon','tire','newspaper','coat hanger','shoe','bucket','pencil','rope','mug','towel','cardboard box','key','cd','sock','toothpick','rubber band','plastic bag','glass bottle'];
        const DURATION = 60000;
        const obj = randItem(OBJECTS);
        let ideas = [];
        let timeLeft = DURATION;
        let finished = false;

        sContent().innerHTML = `
    <div class="divergent-timer" id="dv-timer">60s</div>
    <div class="divergent-prompt">${obj}</div>
    <div class="divergent-sub">List as many alternative uses as you can. There are no wrong answers.</div>
    <input type="text" class="divergent-input" id="dv-input" placeholder="Type an idea, press Enter..." autocomplete="off">
    <div class="divergent-list" id="dv-list">
      <div style="color:var(--text-faint);text-align:center;padding:16px;font-size:13px">Your ideas will appear here</div>
    </div>
  `;
        sControls().innerHTML = `<div style="color:var(--text-dim);font-size:13px">No wrong answers — fluency is the metric.</div>`;

        const input = document.getElementById('dv-input');
        setTimeout(()=>input.focus(), 100);
        input.addEventListener('keydown', (e)=>{
            if(e.key === 'Enter'){
                e.preventDefault();
                const val = input.value.trim();
                if(val && !ideas.find(i=>i.toLowerCase() === val.toLowerCase())){
                    ideas.push(val);
                    input.value = '';
                    renderList();
                } else if(val){
                    input.value = '';
                    showToast('Duplicate idea — not added');
                } else {
                    input.value = '';
                }
            }
        });

        function renderList(){
            const list = document.getElementById('dv-list');
            if(!list) return;
            if(ideas.length === 0){
                list.innerHTML = '<div style="color:var(--text-faint);text-align:center;padding:16px;font-size:13px">Your ideas will appear here</div>';
                return;
            }
            list.innerHTML = [...ideas].reverse().map((idea,i)=>`
      <div class="divergent-list-item">
        <span class="idx">${ideas.length - i}</span>
        <span>${escapeHtml(idea)}</span>
      </div>
    `).join('');
            list.scrollTop = 0;
        }

        function tick(){
            if(finished) return;
            timeLeft -= 1000;
            const el = document.getElementById('dv-timer');
            if(el){
                const s = Math.max(0, Math.ceil(timeLeft / 1000));
                el.textContent = s + 's';
                if(s <= 10) el.style.color = 'var(--danger)';
            }
            if(timeLeft <= 0) finish();
        }

        function finish(){
            if(finished) return;
            finished = true;
            state.difficulty.divergent.lastCount = ideas.length;
            const perf = clamp(ideas.length * 10, 0, 100);
            const interp = `You generated ${ideas.length} unique ${ideas.length === 1 ? 'idea' : 'ideas'} in 60 seconds. ${ideas.length >= 10 ? 'High divergent fluency.' : ideas.length >= 5 ? 'Solid ideational output.' : 'Push for quantity over quality — every idea counts.'}`;
            const extra = ideas.length > 0 ? `
      <div style="text-align:left;margin-top:16px">
        <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:8px">Your ideas</div>
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:6px;max-height:200px;overflow-y:auto">
          ${ideas.map((i,idx)=>`<div class="divergent-list-item"><span class="idx">${idx+1}</span><span>${escapeHtml(i)}</span></div>`).join('')}
        </div>
      </div>` : '';
            go('results', {gameId:'divergent', metrics:[
                    {label:'Unique Ideas', value:ideas.length, unit:''},
                    {label:'Time', value:60, unit:'s'},
                    {label:'Fluency Rate', value:ideas.length, unit:'/min'}
                ], performance:perf, interpretation:interp, extra});
        }

        trackInterval(tick, 1000);
    }

    /* ============================================
       17. RESULTS SCREEN
       ============================================ */
    function renderResults(payload){
        const g = GAMES[payload.gameId];
        const main = document.getElementById('main');

        const cur = state.muscleMap[g.muscleKey];
        state.muscleMap[g.muscleKey] = clamp(cur * 0.6 + payload.performance * 0.4, 0, 100);

        main.innerHTML = `
    <div class="results-screen">
      <div class="check">${svgCheck()}</div>
      <h2>Set Complete</h2>
      <div class="subtitle">${g.name} · ${g.skill}</div>
      <div class="metric-grid">
        ${payload.metrics.map(m=>`
          <div class="metric-card">
            <div class="label">${m.label}</div>
            <div class="value">${m.value}<span class="unit">${m.unit}</span></div>
          </div>
        `).join('')}
      </div>
      <div class="interpretation">${payload.interpretation}</div>
      ${payload.extra || ''}
      <div class="results-actions">
        <button class="btn-secondary" onclick="go('dashboard')">Back to Day ${state.currentDay}</button>
        <button class="btn-primary" onclick="go('session','${payload.gameId}')">Train Again</button>
      </div>
    </div>
  `;
    }

    /* ============================================
       18. BOOT
       ============================================ */
    document.getElementById('streak-num').textContent = state.streak;
    document.getElementById('weekly-min').textContent = state.weeklyMinutes;
    go('onboarding');
</script>
</body>
</html>
